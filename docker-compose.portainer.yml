# NAS stack (Portainer). Image-only; all env values are set in Portainer's UI.
# Bind-mount dirs to create once: /volume1/docker/colloquicrm/postgres, /volume1/docker/colloquicrm/backups, /volume1/docker/colloquicrm/attachments
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - /volume1/docker/colloquicrm/postgres:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: ghcr.io/jwapps-app/colloquicrm:latest
    restart: unless-stopped
    ports:
      # Published on every host interface by default. When the reverse proxy /
      # cloudflared runs on this same host, set APP_BIND=127.0.0.1 (or drop
      # the port and share a docker network) so the proxy is the ONLY way in —
      # see TRUSTED_PROXY_IPS below for why that matters.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3310}:8000"
    environment:
      ENVIRONMENT: production
      APP_NAME: ${APP_NAME:-Colloqui CRM}
      APP_URL: ${APP_URL}
      ALLOWED_ORIGINS: ${APP_URL}
      DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD}@postgres:5432/app
      SECRET_KEY: ${SECRET_KEY}
      ATTACHMENTS_DIR: /data/attachments
      # Org-wide attachment budget; uploads past it are refused with 507.
      ATTACHMENT_QUOTA_MB: ${ATTACHMENT_QUOTA_MB:-5120}
      # Networks whose peers may set cf-connecting-ip. This MUST cover the
      # cloudflared / reverse-proxy container's docker network (the default
      # bridge and user-defined networks live in 172.16.0.0/12) — without it
      # the header is ignored and every user behind the tunnel shares one
      # login/form throttle bucket. Keep it as narrow as the proxy's network:
      # any peer inside it can claim any client address — and a DIRECT
      # connection through the published port arrives from the docker bridge
      # gateway, which is inside this default range. So with the port
      # reachable from the LAN and this broad trust, a direct caller can spoof
      # cf-connecting-ip and sidestep the per-IP throttles. Fix one side: bind
      # the port to loopback (APP_BIND=127.0.0.1) or set this to the proxy
      # container's exact address (e.g. 172.20.0.5/32).
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
    volumes:
      - /volume1/docker/colloquicrm/attachments:/data/attachments
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: app
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: app
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - /volume1/docker/colloquicrm/backups:/backups
    mem_limit: 128m
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          # Dump to a temp name and move it into place only on success: a
          # restart re-runs on the same date, and a failed dump written
          # straight to app-DATE.dump would truncate that day's good one.
          # (*.dump.partial never matches the retention find below.)
          target="/backups/app-$$(date +%F).dump"
          if pg_dump -Fc -f "$${target}.partial" && mv -f "$${target}.partial" "$${target}"; then
            find /backups -name '*.dump' -mtime +$${RETENTION_DAYS} -delete
            date > /backups/last-success
          else
            rm -f "$${target}.partial"
            echo "BACKUP FAILED $$(date)" | tee -a /backups/failures.log
          fi
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
